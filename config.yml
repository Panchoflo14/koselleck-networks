# Project configuration

# Default: a sibling folder next to this repo. Override in config.local.yml
# (gitignored, not committed) if your data lives elsewhere - e.g. deliberately
# outside any cloud-synced folder, to avoid sync conflicts while scripts
# actively rewrite multi-GB files.
data_root: "../koselleck-data"

paths:
  # corpus_tcp is the one corpus tree, for every source - not just TCP's own
  # releases despite the name (kept as-is to avoid renaming an already-
  # populated multi-GB local folder for a cosmetic win). discover_sources()
  # scans <corpus_tcp>/<region>/<source>/*.zip so a new TCP-format source
  # needs zero config changes - just drop zips under a region folder and
  # rerun. That folder layout is only a convenience for auto-discovery,
  # though, not what actually keeps sources or periods apart: parse_tcp.py
  # tags every record with its region/source/year regardless of where the
  # raw file physically sat, and bucket_periods.py buckets purely on that
  # year - so a corpus in a different raw format (e.g. the planned
  # Gutenberg 1800-1900 supplement) just needs its own reader in
  # parse_tcp.py; where its raw files happen to live on disk doesn't matter
  # once that reader produces the same tagged record everything downstream
  # already expects. Anything outside this "regions" folder (old format
  # variants, reference files) is ignored by the pipeline.
  corpus_tcp:      corpus/tcp/regions
  corpus_bl:       corpus/bl              # British Library 19th-century JSONL, see parse_tcp.py's iter_bl_records
  extracted:       processed             # flat per-document extraction (parse_tcp.py)
  processed:       processed/periods     # per-period bucketed text (bucket_periods.py)
  vocab:           processed/vocab
  embeddings:      embeddings
  networks:        networks
  communities:     communities

# Time slices (start_year, end_year, label)
# Uniform 20-year windows across the whole range, not just around the
# Sattelzeit. Fine resolution only near 1770-1830 would bias the method
# toward finding reorganization only where we already expected it - Heuser's
# own chapter found a second, unrelated acceleration window around 1905-25,
# which a Sattelzeit-only fine resolution could never have detected. Uniform
# windows also give a consistent time step for the interactive search tool.
#
# Start shifted from 1500 to 1510 (2026-08-04, Panch's call): with a 1500
# start, sattelzeit_window's edges (1770/1830) fell in the *middle* of a
# window each, so "the transition that closes the Sattelzeit" was always an
# approximation (1780-1800 -> 1800-1820) rather than a literal edge. +10
# years makes both 1770 and 1830 land exactly on a period boundary -
# 1750-1770 -> 1770-1790 is now literally where the Sattelzeit begins, and
# 1810-1830 -> 1830-1850 is literally where it closes - without changing
# window width, period count, or per-window corpus size at all. A parallel
# option (10-year windows instead of a shift) was considered and rejected:
# it also happens to align, but halves the shared vocabulary in every
# window, which directly worsens the exact small-sample-artifact ambiguity
# subsample_control.py already found at the current Sattelzeit-closing
# transition - the wrong direction to move right before the paper needs
# that resolved, not amplified.
#
# 1890-1910 stays defined here even though TCP alone barely covers it - it
# fills in once the Gutenberg supplement is sourced; embeddings.py already
# skips any period below MIN_DOCS instead of failing on it.
periods:
  - [1510, 1530, "1510-1530"]
  - [1530, 1550, "1530-1550"]
  - [1550, 1570, "1550-1570"]
  - [1570, 1590, "1570-1590"]
  - [1590, 1610, "1590-1610"]
  - [1610, 1630, "1610-1630"]
  - [1630, 1650, "1630-1650"]
  - [1650, 1670, "1650-1670"]
  - [1670, 1690, "1670-1690"]
  - [1690, 1710, "1690-1710"]
  - [1710, 1730, "1710-1730"]
  - [1730, 1750, "1730-1750"]
  - [1750, 1770, "1750-1770"]   # Sattelzeit begins here
  - [1770, 1790, "1770-1790"]
  - [1790, 1810, "1790-1810"]
  - [1810, 1830, "1810-1830"]   # Sattelzeit closes here
  - [1830, 1850, "1830-1850"]
  - [1850, 1870, "1850-1870"]
  - [1870, 1890, "1870-1890"]
  - [1890, 1910, "1890-1910"]

sattelzeit_window: [1770, 1830]

# word2vec training
word2vec:
  vector_size: 200
  window: 5
  min_count: 50
  workers: 4
  epochs: 10
  seed: 42

# Network construction
# top_k, not a fixed threshold: at this vocab scale (tens of thousands of
# words per period) a 0.3 cosine threshold produced near-complete graphs
# (density ~0.1, tens to hundreds of millions of edges per period) - useless
# for community detection and impractically large as GraphML. top_k keeps
# each word's 15 nearest neighbours, bounding the graph to roughly V*15 edges
# regardless of vocab size.
network:
  similarity_threshold: 0.3   # unused while top_k is set; kept as a documented fallback
  top_k: 15                   # keep only the k nearest neighbours per word

# Community detection (Leiden)
leiden:
  resolution_sweep: [0.1, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
  n_iterations: 10
  seed: 42
